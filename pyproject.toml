[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinflow-traffic"
version = "0.1.0"
description = "Physics-informed three-phase traffic state inversion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20",
  "pandas>=1.3",
  "matplotlib>=3.4",
  "scipy>=1.7",
  "PyYAML>=6",
  "torch>=2.0,<3",
]

[project.scripts]
spinflow = "spinflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]
